
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "orders"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "inventory"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "payment"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]
